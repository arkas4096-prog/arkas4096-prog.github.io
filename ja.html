<title>裵相元 ♥ 芝中希望 — 結婚式のご案内</title>

<style>
  @font-face{font-family:"MaruBuri";font-weight:100 900;font-display:swap;
    src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format("woff2");}
  :root{
    color-scheme:only light;
    --bg:#f4efe7; --ink:#2a2622; --sub:#8a8076; --rose:#c27a86; --rose-d:#a85f6c;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:radial-gradient(120% 80% at 50% 30%,#fbf8f3 0%,var(--bg) 60%,#ebe2d5 100%);
    font-family:"MaruBuri","Hiragino Mincho ProN",serif;color:var(--ink);overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
  #petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}

  /* ── 봉투 (300 × 200 비율) ── */
  .scene{position:relative;width:min(84vw,340px);aspect-ratio:3/2;cursor:pointer;
    opacity:0;transform:translateY(24px);animation:enter 1.2s var(--ease) .2s forwards;}
  @keyframes enter{to{opacity:1;transform:none}}
  .float{position:absolute;inset:0;perspective:900px;perspective-origin:50% 0%;animation:bob 4.5s ease-in-out 1.4s infinite;}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .opened .float{animation:none;}
  .float>svg,.float>div{position:absolute;}
  .shadow{inset:6% 3% -4% 3%;border-radius:50%;background:radial-gradient(closest-side,rgba(80,55,35,.28),transparent);filter:blur(10px);transform:translateY(14%);}
  .back{inset:0;width:100%;height:100%;z-index:1;}
  .letter{left:5%;right:5%;top:5%;height:88%;z-index:2;border-radius:0;
    background:#fffefc;
    box-shadow:0 1px 3px rgba(90,60,40,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    transition:transform 1.2s var(--ease);}
  .letter::before{content:"";position:absolute;inset:7px;border:1px solid rgba(194,122,134,.35);border-radius:0;pointer-events:none;}
  .letter .of{font:italic 400 clamp(11px,3.2vw,13px)/1 "Cormorant Garamond",serif;letter-spacing:.24em;color:var(--sub);}
  .letter .nm{margin-top:10px;font:italic 400 clamp(24px,7.4vw,30px)/1.2 "Cormorant Garamond",serif;letter-spacing:.03em;}
  .letter .nm span{font-style:normal;font-size:.8em;margin:0 .1em;color:var(--rose);}
  .letter .dt{margin-top:12px;font:500 clamp(10px,3vw,12px)/1 "Cormorant Garamond",serif;letter-spacing:.3em;color:var(--sub);}
  .letter .orn{width:44px;height:16px;margin-top:14px;color:var(--rose);}
  .pocket{inset:0;width:100%;height:100%;z-index:3;}

  /* 위 덮개: 윗변을 축으로 뒤로 넘어가며 뒤집힘 (바깥면 → 안감) */
  .flap{left:0;top:0;width:100%;height:64%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
    transition:transform 1.15s cubic-bezier(.45,.05,.25,1);}
  .flap svg{position:absolute;inset:0;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:visible;}
  .flap .in{transform:rotateX(180deg);}
  .flap .shade{transition:opacity 1.15s;opacity:0;}
  .seal{left:50%;top:56%;width:50px;height:50px;margin:-25px 0 0 -25px;z-index:6;
    filter:drop-shadow(0 1px 1.5px rgba(40,45,52,.3)) drop-shadow(0 2px 4px rgba(40,45,52,.12));
    transition:transform .55s var(--ease),opacity .45s;}
  .seal svg{width:100%;height:100%;display:block;overflow:visible;}

  /* ── 열리는 순서 ── */
  .opened .seal{transform:translateY(8px) scale(.85) rotate(-14deg);opacity:0;}
  .flipping .flap{transform:rotateX(180deg);}     /* 끝이 앞으로 들리며 위로 넘어감 */
  .flipping .flap .shade{opacity:1;}
  .behind .flap{z-index:1;}                       /* 덮개가 넘어간 뒤에는 편지 뒤로 */
  .rising .letter{transform:translateY(-70%);}
  .expand .scene{transition:transform 1.1s var(--ease),opacity .9s ease .2s;}
  .expand .back,.expand .pocket,.expand .flap,.expand .shadow{transition:opacity .6s;opacity:0;}
  .expand .letter>*{transition:opacity .35s;opacity:0;}

  .hint{position:fixed;left:0;right:0;bottom:calc(14vh + env(safe-area-inset-bottom));text-align:center;z-index:6;
    font-size:13px;letter-spacing:.08em;color:var(--sub);opacity:0;animation:enter 1s ease 1.4s forwards,pulse 2.4s ease-in-out 2.4s infinite;}
  @keyframes pulse{50%{opacity:.45}}
  .opened .hint{display:none;}
  .skip{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:7;padding:8px 14px;border:1px solid rgba(138,128,118,.35);
    border-radius:999px;background:rgba(255,255,255,.5);font:500 12px/1 "Cormorant Garamond",serif;letter-spacing:.12em;color:var(--sub);
    text-decoration:none;backdrop-filter:blur(6px);}
  .veil{position:fixed;inset:0;z-index:8;background:#fbfaf7;opacity:0;pointer-events:none;transition:opacity .8s ease;}
  .done .veil{opacity:1;}
  @media (prefers-reduced-motion: reduce){ .scene,.hint{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>

<!-- 공용 그라데이션 · 종이결 · 안감 무늬 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- 면지 결: 빛을 받은 미세한 요철을 아주 약하게(10%)만 곱해 줌 -->
      <feTurbulence type="fractalNoise" baseFrequency=".9 .55" numOctaves="3" seed="7" result="t"/>

    <!-- 실링왁스 (레드와인, 무광) -->
    <filter id="wax" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="2.2" diffuseConstant="1.12" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="58"/></feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="d" mode="multiply" result="sh"/>
      <feSpecularLighting in="b" surfaceScale="2.4" specularConstant=".35" specularExponent="9" lighting-color="#fff" result="s"><fePointLight x="-50" y="-70" z="90"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="sh" in2="s2" operator="arithmetic" k2="1" k3=".6" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="press" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="1" dy="1.4" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="1.1" result="eb"/>
      <feFlood flood-color="#353a40" flood-opacity=".38"/><feComposite in2="eb" operator="in" result="dark"/>
      <feOffset in="SourceAlpha" dx="-.9" dy="-1.2" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="edge2"/>
      <feGaussianBlur in="edge2" stdDeviation=".8" result="eb2"/>
      <feFlood flood-color="#ffffff" flood-opacity=".4"/><feComposite in2="eb2" operator="in" result="lite"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="lite"/></feMerge>
    </filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="-.6" dy="-.8" result="hi"/>
      <feComposite in="hi" in2="SourceAlpha" operator="out" result="hiE"/>
      <feFlood flood-color="#ffffff" flood-opacity=".75"/><feComposite in2="hiE" operator="in" result="lite"/>
      <feOffset in="SourceAlpha" dx=".7" dy="1" result="lo"/>

      <feMerge><feMergeNode in="dark"/><feMergeNode in="SourceGraphic"/><feMergeNode in="lite"/></feMerge>
    </filter>
  </defs>

<script>
(function(){
  "use strict";
  /* 日本語の封筒エントランス */
  var lang = 'ja';
  var target = 'main.html?lang=ja';
  document.documentElement.lang = 'ja';
  document.title = '裵相元 ♥ 芝中希望 — 結婚式のご案内';
  document.getElementById('hint').textContent = 'タップして招待状を開く';
  document.getElementById('scene').setAttribute('aria-label', '招待状を開く');
  document.getElementById('skip').href = target;

  var scene = document.getElementById('scene'), letter = document.getElementById('letter'), started = false;
  function go(){ location.replace(target); }
  function at(ms, fn){ setTimeout(fn, ms); }
  function open(){
    if(started) return; started = true;
    var b = document.body;
    b.classList.add('opened');                                   /* 봉인이 떨어짐 */
    at(350,  function(){ b.classList.add('flipping'); });         /* 덮개가 뒤로 넘어가며 뒤집힘 */
    at(900,  function(){ b.classList.add('behind'); });           /* 반쯤 넘어가면 편지 뒤로 */
    at(1550, function(){ b.classList.add('rising'); });           /* 편지가 올라옴 */
    at(3000, function(){                                          /* 편지가 화면 가득 펼쳐짐 */
      var r = letter.getBoundingClientRect(), sc = scene.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var s = Math.max(innerWidth / r.width, innerHeight / r.height) * 1.1;
      scene.style.transformOrigin = (cx - sc.left) + 'px ' + (cy - sc.top) + 'px';
      b.classList.add('expand');
      scene.style.transform = 'translate(' + (innerWidth / 2 - cx) + 'px,' + (innerHeight / 2 - cy) + 'px) scale(' + s + ')';
      scene.style.opacity = '0';
    });
    at(3600, function(){ b.classList.add('done'); });
    at(4300, go);
  }
  /* 등장 애니메이션이 끝나면 풀어 줘야 마지막 확대(transform)가 적용됨 */
  scene.addEventListener('animationend', function(e){
    if(e.animationName !== 'enter') return;
    scene.style.animation = 'none'; scene.style.opacity = '1'; scene.style.transform = 'none';
  });
  scene.addEventListener('click', open);
  scene.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  /* 흩날리는 벚꽃잎 (본 청첩장과 같은 모양, 개수만 적게) */
  var cv = document.getElementById('petals'), g = cv.getContext('2d'), W, H, D, P = [];
  function path(c, s){
    c.beginPath(); c.moveTo(0, s);
    c.bezierCurveTo(-.62*s, .7*s, -.66*s, -.1*s, -.3*s, -.9*s);
    c.quadraticCurveTo(-.14*s, -1.02*s, 0, -.74*s);
    c.quadraticCurveTo(.14*s, -1.02*s, .3*s, -.9*s);
    c.bezierCurveTo(.66*s, -.1*s, .62*s, .7*s, 0, s); c.closePath();
  }
  var spr = document.createElement('canvas'); spr.width = spr.height = 96;
  (function(){ var c = spr.getContext('2d'), s = 40; c.translate(48, 48);
    var gr = c.createLinearGradient(0, s, 0, -s);
    gr.addColorStop(0, '#eb9db1'); gr.addColorStop(.45, '#f7c5d2'); gr.addColorStop(1, '#fff0f4');
    path(c, s); c.fillStyle = gr; c.fill(); })();
  function spawn(p, any){
    var z = Math.random();
    p.z = z; p.s = 9 + z * 11; p.x = Math.random() * W; p.y = any ? Math.random() * H : -20;
    p.vy = .35 + z * .5; p.r = Math.random() * 6.3; p.vr = (Math.random() - .5) * .04;
    p.f = Math.random() * 6.3; p.vf = .02 + Math.random() * .03; p.sw = Math.random() * 6.3; return p;
  }
  function size(){ D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D;
    while(P.length < 16) P.push(spawn({}, true)); }
  size(); addEventListener('resize', size);
  var last = performance.now();
  (function tick(now){
    var dt = Math.min(now - last, 50) / 16.7; last = now;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    for(var i = 0; i < P.length; i++){
      var p = P[i]; p.sw += .012 * dt;
      p.x += (.25 + Math.sin(p.sw) * .5) * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.f += p.vf * dt;
      if(p.y > H + 30 || p.x > W + 30) spawn(p, false);
      var ax = Math.abs(Math.cos(p.f)), k = p.s / 80 * D, sx = k * (.28 + .72 * ax), cr = Math.cos(p.r), sr = Math.sin(p.r);
      g.globalAlpha = (.55 + p.z * .35) * (.72 + .28 * ax);
      g.setTransform(cr * sx, sr * sx, -sr * k, cr * k, p.x * D, p.y * D);
      g.drawImage(spr, -48, -48);
    }
    requestAnimationFrame(tick);
  })(last);
})();
</script>
